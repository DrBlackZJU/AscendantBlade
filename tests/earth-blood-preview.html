.hidden{display:none!important}.notes{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;border-top:1px solid var(--border);padding-top:17px;margin-top:20px}.notes b{font-weight:500;color:#dddbc0}.notes p{margin-top:5px;font-size:12px}footer{margin:18px 0;color:#82927b;font-size:12px;line-height:1.8}.legend{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:#80967c}@media(max-width:700px){main{padding:0 12px;margin:18px auto}h1{font-size:22px}.badge{display:none}.captions>div{padding:10px}.stage.single .captions{grid-template-columns:1fr}.stage.candidate .captions>div:first-child,.stage.current .captions>div:last-child{display:none}.stage.single .captions>div{border-left:0}.captions b{font-size:13px}.captions span{font-size:10px}.tabs button{font-size:12px;padding:8px 9px}.notes{grid-template-columns:1fr;gap:14px}.legend{font-size:10px}}

<header><div><div class="eyebrow">COMBAT FX / STUDY 009</div><h1>裂地与血爆 · 五组试映</h1><p id="intro">余震：二重斩的金橙地裂沿突刺方向继续延伸。</p></div><span class="badge">五组特效 · 已接入游戏</span></header>
<nav class="tabs" aria-label="特效选择"><button data-group="aftershock" class="active">余震 · 定向裂地</button><button data-group="blood">血爆</button><button data-group="rock">岩石突刺</button><button data-group="stone">普通 stone 震波</button><button data-group="greatStomp">大震踏</button></nav>
<section class="stage" aria-label="现有美术与候选美术对照"><div class="captions"><div><b id="old-name">现有 · 额外岩石排</b><span id="old-tag">二重斩喷发 + 另一排岩石</span></div><div><b id="new-name">候选 · 延长一道地裂</b><span id="new-tag">同款金橙喷发沿前方裂缝推进</span></div></div><canvas id="scene" width="1600" height="510" aria-label="左侧现有美术，右侧候选美术">需要支持 Canvas 的浏览器。</canvas></section>
<div class="legend"><span>左：现有绘制配方对照</span><span>右：候选美术 · 同一角色比例、同一范围</span></div>
<div class="controls"><button id="replay" class="key">重新触发</button><button id="pause">暂停</button><button id="step">前进一帧</button><label>观看方式 <select id="view"><option value="compare">左右对照</option><option value="candidate">只看候选</option><option value="current">只看现有</option></select></label><label>速度 <select id="speed"><option value="0.25">0.25×</option><option value="0.5" selected>0.5×</option><option value="1">1×</option></select></label><button id="start-frame">起效瞬间</button><button id="peak">爆发高点</button><button id="tail">收尾瞬间</button></div>
<div class="controls"><label><input id="actors" type="checkbox" checked>角色比例</label><label><input id="range" type="checkbox">范围参考</label><label><input id="loop" type="checkbox" checked>循环播放</label><label id="face-control">突刺方向 <select id="face"><option value="1">向右 →</option><option value="-1">← 向左</option></select></label><label id="full-control"><input id="full" type="checkbox" checked>满蓄</label><label id="blood-control" class="hidden">血爆来源 <select id="blood-source"><option value="alphaBloodFeast">盛大谢幕 · R240</option><option value="bloodExecutionerBurst">浴血盛宴 · R150</option></select></label><label id="count-control" class="hidden">连杀强度 <select id="count"><option value="1">1 次</option><option value="3" selected>3 次</option><option value="6">6 次</option></select></label><label id="stone-control" class="hidden">震波范围 <select id="stone-radius"><option value="130">R130</option><option value="175" selected>R175</option><option value="235">R235</option></select></label></div>
<div class="controls"><label for="timeline">时间轴</label><input id="timeline" type="range" min="0" max="2.7" step="0.001" value="0"><output id="clock" for="timeline">0.00 s</output></div>

<footer>本页仅模拟动作与美术，不结算伤害。五组候选已接入游戏，本页使用相同的生产绘制代码。范围取现有代表值，用于检查可读性；连杀强度仅预览美术密度。</footer>
