<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>BOSS 技能验收</title>
<script src="../game.js"></script>
<style>body{margin:0;background:#10191f;color:#d8e1d6;font:16px sans-serif}h1{font-size:20px;margin:18px 24px}canvas{display:block;width:min(100%,1440px);height:auto;margin:auto}p{margin:12px 24px;color:#a3b6b7}</style>
<h1>BOSS 技能与模型验收</h1><canvas id="preview" width="1440" height="880" aria-label="毒球、梦魇锁定、断腿短跃、石碑召唤、钻地模型和锤头判定"></canvas><p id="status">正在绘制</p>
<script src="../motion.js"></script><script src="../boss.js"></script><script src="../enemy.js"></script><script src="../combat.js"></script>
<script>
'use strict';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),{Game,TYPES,MOVES}=AshCombat;
const cards=[['plague','瘟疫毒球 · 三次发射'],['nightmare','锁定追魂 · 屏幕变暗'],['fortress','断腿后 · 短跃震击'],['profane_obelisk','召唤亵渎石碑'],['claw_beast','钻地模型 · 扩大 20%'],['war_hammer','锤头 · 攻击判定']];
cards.forEach(([kind,title],i)=>{
 const ox=i%3*480,oy=Math.floor(i/3)*440,g=new Game(717);g.enemies=[];g.loopWorld=true;const type=Object.keys(TYPES).find(id=>TYPES[id].bossKind===kind),e=g.spawn(type,130,550);e.spawnDelay=0;e.face=1;e.cd=1000;g.p.x=390;g.p.y=550;g.time=2;
 const move=action=>TYPES[type].moveKeys.find(k=>MOVES[k].action===action);
 const begin=action=>g.beginEnemyMove(e,move(action));
 if(kind==='plague'){begin('plagueOrb');g.resolveEnemySpell(e,e.attack);g.projectiles[0].x=320;}
 if(kind==='nightmare'){e.enraged=true;begin('nightmareHunt');e.t=e.attack.wind*.7;}
 if(kind==='fortress'){e.hp=e.maxHp*.2;begin('bastionHop');e.state='active';e.t=0;g.enemyStep(e,.19);}
 if(kind==='profane_obelisk'){begin('summonObelisk');g.resolveEnemySpell(e,e.attack);const child=g.enemies[1];child.x=335;child.spawnDelay=0;}
 if(kind==='claw_beast')begin('burrow');
 if(kind==='war_hammer'){begin('melee');e.state='active';e.t=e.attack.active*.35;}
 c.save();c.beginPath();c.rect(ox+5,oy+5,470,430);c.clip();c.translate(ox,oy);c.fillStyle='#1c2b31';c.fillRect(5,5,470,430);c.strokeStyle='#3e555c';c.beginPath();c.moveTo(15,350);c.lineTo(465,350);c.stroke();
 c.save();c.translate(0,-200);
 AshBossModels.effects(c,g);
 if(kind==='claw_beast'){AshBossModels.burrow(c,e,{time:2});c.strokeStyle='#e95855';c.beginPath();c.ellipse(340,550,65*1.8,22*1.8,0,0,Math.PI*2);c.stroke();}
 else for(const actor of g.enemies){const b=TYPES[actor.type];AshBossModels.draw(c,actor,b.bossModel?{...b,bossKind:b.bossModel}:b,{time:2});}
 for(const b of g.projectiles)AshBossModels.projectile(c,b);
 if(kind==='war_hammer'){const h=AshBossModels.hammerHead(e,2);c.strokeStyle='#ff756c';c.lineWidth=2;c.beginPath();c.ellipse(h.x,h.y-h.z,e.scale*85,e.scale*45,0,0,Math.PI*2);c.stroke();}
 c.restore();c.fillStyle='#d8e1d6';c.font='19px sans-serif';c.fillText(title,20,34);c.font='14px sans-serif';c.fillStyle='#a3b6b7';c.fillText('实际技能状态与游戏模型',20,414);c.restore();
});document.querySelector('#status').textContent='6 个场景绘制完成';
</script></html>
